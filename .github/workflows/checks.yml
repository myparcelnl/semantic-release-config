name: Checks

# Triggered by push, not by pull_request. On a pull_request event env-ci reads the branch from
# GITHUB_REF, which is then refs/pull/<n>/merge, and semantic-release skips that branch instead
# of rehearsing it. The runner ignores any attempt to override GITHUB_REF through `env`.
# Checks report on the head commit either way, so they still gate the pull request.
on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

  dry-run:
    # Dependabot gets a read-only token and no access to the secrets below, so semantic-release
    # cannot verify its conditions on its branches. Those get the lint job only.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Git credentials
        id: credentials
        uses: myparcelnl/actions/setup-git-credentials@v4
        with:
          app-id: ${{ secrets.MYPARCEL_APP_ID }}
          private-key: ${{ secrets.MYPARCEL_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.credentials.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The branch name goes through the environment, never into the run script, because it is
      # attacker input. The grep fails the step when semantic-release skips the branch rather
      # than analysing it, which it does silently and with exit code 0.
      - name: Release dry-run
        env:
          GITHUB_TOKEN: ${{ steps.credentials.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          npx semantic-release --dry-run --branches "$BRANCH" | tee "$RUNNER_TEMP/dry-run.log"
          grep -qE 'The next release version is|There are no relevant changes' "$RUNNER_TEMP/dry-run.log" ||
            {
              echo "::error::semantic-release skipped this branch instead of analysing it"
              exit 1
            }
